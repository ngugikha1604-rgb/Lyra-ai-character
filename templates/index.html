<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyra Stream Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #050510;
      --card-bg: rgba(15, 15, 35, 0.7);
      --accent-primary: #00f5ff;
      --accent-secondary: #7000ff;
      --text-main: #e0e0f0;
      --text-dim: #a0a0b8;
      --glass-border: rgba(255, 255, 255, 0.1);
      --neon-glow: 0 0 15px rgba(0, 245, 255, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 245, 255, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- LAYOUT --- */
    .dashboard-container {
      display: grid;
      grid-template-columns: 350px 1fr;
      grid-template-rows: 80px 1fr 120px;
      gap: 20px;
      padding: 20px;
      height: 100vh;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    /* --- HEADER --- */
    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 0 30px;
      box-shadow: var(--neon-glow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .status-group {
      display: flex;
      gap: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      box-shadow: 0 0 5px rgba(255,255,255,0.1);
    }

    .dot.active {
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary);
      animation: pulse 2s infinite;
    }

    .dot.streaming {
      background: #ff4757;
      box-shadow: 0 0 10px #ff4757;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* --- SIDEBAR --- */
    .sidebar {
      grid-column: 1;
      grid-row: 2 / -1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- CHAT BOX --- */
    .chat-container {
      grid-column: 2;
      grid-row: 2;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
    }

    #chatHistory {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-primary) transparent;
    }

    #chatHistory::-webkit-scrollbar {
      width: 4px;
    }
    #chatHistory::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 10px;
    }

    .message {
      max-width: 80%;
      padding: 14px 20px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
      animation: messageSlide 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @keyframes messageSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent-secondary), #4b0082);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .message .sender {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 5px;
      opacity: 0.7;
    }

    /* --- CONTROLS --- */
    .controls-container {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    #userInput {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      padding: 18px 30px;
      color: white;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }

    #userInput:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .btn {
      cursor: pointer;
      border: none;
      outline: none;
      border-radius: 100px;
      font-weight: 700;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-send {
      width: 60px;
      height: 60px;
      background: var(--accent-primary);
      color: var(--bg-color);
      border-radius: 50%;
    }

    .btn-send:hover {
      transform: scale(1.05) rotate(5deg);
      box-shadow: 0 0 20px var(--accent-primary);
    }

    .btn-stream {
      padding: 15px 30px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
    }

    .btn-stream.active {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      color: white;
      border: none;
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
    }

    .btn-stream:hover {
      background: rgba(255,255,255,0.1);
    }

    /* --- STATS --- */
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stat-label { font-size: 12px; color: var(--text-dim); }
    .stat-value { font-size: 14px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

    /* --- MONOLOGUE OVERLAY --- */
    #monologueDisplay {
      position: fixed;
      top: 100px;
      right: 40px;
      max-width: 300px;
      background: rgba(0, 0, 0, 0.5);
      border-left: 4px solid var(--accent-primary);
      padding: 15px;
      border-radius: 4px 12px 12px 4px;
      font-style: italic;
      color: var(--text-dim);
      font-size: 13px;
      opacity: 0;
      transform: translateX(50px);
      transition: all 0.5s ease;
      pointer-events: none;
    }

    #monologueDisplay.active {
      opacity: 1;
      transform: translateX(0);
    }

  </style>
</head>

<body>

  <div class="dashboard-container">
    <header>
      <div class="brand">
        <h1>LYRA</h1>
        <div class="status-group">
          <div class="status-item">
            <span class="dot active" id="dotVTS"></span> VTS
          </div>
          <div class="status-item">
            <span class="dot" id="dotStream"></span> STREAM
          </div>
          <div class="status-item">
            <span class="dot" id="dotThinking"></span> AI
          </div>
        </div>
      </div>
      
      <div class="actions">
        <button class="btn btn-stream" id="btnStartStream">Bắt đầu Stream</button>
        <button class="btn btn-stream" id="btnStopStream" style="display:none;">Dừng Stream</button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="card">
        <div class="card-title">Lyra Status</div>
        <div class="stat-row">
          <span class="stat-label">Cảm xúc</span>
          <span class="stat-value" id="valEmotion">Neutral</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Tình cảm</span>
          <span class="stat-value" id="valAffection">50</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Tâm trạng</span>
          <span class="stat-value" id="valMood">0</span>
        </div>
      </div>

      <div class="card" style="flex: 1;">
        <div class="card-title">Stream Info</div>
        <div id="streamDetails" style="font-size: 13px; color: var(--text-dim); line-height: 1.6;">
          Chưa bắt đầu stream...
        </div>
      </div>
    </aside>

    <main class="chat-container">
      <div id="chatHistory">
        <!-- Tin nhắn sẽ xuất hiện ở đây -->
      </div>
    </main>

    <div class="controls-container">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Gửi tin nhắn cho Lyra...">
      </div>
      <button class="btn btn-send" id="btnSend">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
      </button>
    </div>
  </div>

  <div id="monologueDisplay">
    <div id="monologueContent"></div>
  </div>

  <audio id="lyraVoice" hidden></audio>

  <script>
    /* ==================== CORE LOGIC ==================== */

    const chatHistory = document.getElementById("chatHistory");
    const userInput = document.getElementById("userInput");
    const btnSend = document.getElementById("btnSend");
    const btnStart = document.getElementById("btnStartStream");
    const btnStop = document.getElementById("btnStopStream");
    const dotStream = document.getElementById("dotStream");
    const dotThinking = document.getElementById("dotThinking");
    const valEmotion = document.getElementById("valEmotion");
    const valAffection = document.getElementById("valAffection");
    const valMood = document.getElementById("valMood");
    const monologueDisplay = document.getElementById("monologueDisplay");
    const monologueContent = document.getElementById("monologueContent");

    let isStreaming = false;

    // --- CHAT FUNCTIONS ---

    function appendMessage(role, text, sender = "Lyra") {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;
      
      const senderDiv = document.createElement("div");
      senderDiv.className = "sender";
      senderDiv.innerText = role === "user" ? "BẠN" : sender;
      
      const contentDiv = document.createElement("div");
      contentDiv.className = "text";
      contentDiv.innerText = text;
      
      msgDiv.appendChild(senderDiv);
      msgDiv.appendChild(contentDiv);
      
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function showMonologue(text) {
      if (!text) return;
      monologueContent.innerText = text;
      monologueDisplay.classList.add("active");
      if (window.monologueTimeout) clearTimeout(window.monologueTimeout);
      window.monologueTimeout = setTimeout(() => {
        monologueDisplay.classList.remove("active");
      }, 5000);
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";
      dotThinking.classList.add("active");

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        handleAIResponse(data);
      } catch (err) {
        console.error("Chat error:", err);
      } finally {
        dotThinking.classList.remove("active");
      }
    }

    function handleAIResponse(data) {
      if (data.reply) {
        appendMessage("assistant", data.reply);
        speakText(data.reply);
      }
      if (data.monologue) {
        showMonologue(data.monologue);
      }
      
      // Update Stats
      valEmotion.innerText = data.emotion || "Neutral";
      valAffection.innerText = data.affection || "50";
      valMood.innerText = data.mood || "0";
    }

    // --- STREAM CONTROLS ---

    btnStart.onclick = async () => {
      try {
        // Bạn có thể tùy biến payload live_chat_id ở đây
        const res = await fetch("/stream/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ platform: "youtube", channel_id: "default" })
        });
        if (res.ok) {
          isStreaming = true;
          btnStart.style.display = "none";
          btnStop.style.display = "block";
          dotStream.classList.add("active", "streaming");
          document.getElementById("streamDetails").innerText = "Stream đang diễn ra...";
        }
      } catch (err) { console.error("Start error:", err); }
    };

    btnStop.onclick = async () => {
      try {
        const res = await fetch("/stream/stop", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ platform: "youtube", channel_id: "default" })
        });
        if (res.ok) {
          isStreaming = false;
          btnStop.style.display = "none";
          btnStart.style.display = "block";
          dotStream.classList.remove("active", "streaming");
          document.getElementById("streamDetails").innerText = "Stream đã dừng. Lyra đang viết nhật ký...";
        }
      } catch (err) { console.error("Stop error:", err); }
    };

    // --- AUDIO / TTS ---

    async function speakText(text) {
      try {
        const res = await fetch("/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        if (!res.ok) return;
        
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = document.getElementById("lyraVoice");
        audio.src = url;
        audio.play();
      } catch (err) { console.error("TTS output error:", err); }
    }

    // --- SSE FOR STREAM MESSAGES ---

    const eventSource = new EventSource("/stream/events");
    eventSource.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === "connected") return;
      
      // Viewer message or Lyra reply
      if (data.reply) {
        // Nếu là Lyra trả lời tin nhắn từ Stream
        appendMessage("assistant", data.reply, data.sender_name || "Lyra");
        speakText(data.reply);
      }
      
      if (data.monologue) showMonologue(data.monologue);
      
      // Update stats
      valEmotion.innerText = data.emotion || valEmotion.innerText;
      valAffection.innerText = data.affection || valAffection.innerText;
    };

    // --- INTERACTION ---

    btnSend.onclick = sendMessage;
    userInput.onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

    // Initial status check
    window.onload = async () => {
      const res = await fetch("/status");
      if (res.ok) handleAIResponse(await res.json());
    };

  </script>
</body>
</html>
